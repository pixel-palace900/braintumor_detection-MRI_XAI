<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Neuro Diagnosis</title>
    <meta name="description" content="Recover your Neuro Diagnosis account access">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none text-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>

                    <div class="login-card">
                        <div class="login-header" style="background: linear-gradient(135deg, #7BB661 0%, #6BA055 100%);">
                            <i class="bi bi-key-fill"></i>
                            <h1 class="h3 mb-2">Account Recovery</h1>
                            <p class="mb-0">Reset your password</p>
                        </div>

                        <div class="login-body">
                            <div id="recoveryFormContainer">
                                <p class="text-center text-muted mb-4">
                                    Enter your registered email address and we'll send you a link to reset your password.
                                </p>
                                <form id="forgotPasswordForm">
                                    <div class="mb-4">
                                        <label for="email" class="form-label">
                                            <i class="bi bi-envelope me-2"></i>Email Address
                                        </label>
                                        <input type="email" class="form-control form-control-lg" id="email"
                                            placeholder="Enter your email" required>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                        <i class="bi bi-send me-2"></i>Send Reset Link
                                    </button>
                                </form>
                            </div>

                            <div id="successMessage" class="text-center d-none">
                                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                                <h3 class="mt-3 fw-bold">Link Sent!</h3>
                                <p class="text-muted mb-4">
                                    We've sent a password reset link to <strong id="sentEmail"></strong>. 
                                    Please check your inbox (and spam folder).
                                </p>
                                <a href="index.html" class="btn btn-outline-primary w-100">Return to Home</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Show loading state
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';

            // Simulate API delay
            setTimeout(() => {
                document.getElementById('recoveryFormContainer').classList.add('d-none');
                document.getElementById('successMessage').classList.remove('d-none');
                document.getElementById('sentEmail').textContent = email;
                
                if(window.showAlert) {
                    showAlert('Reset link sent successfully!', 'success');
                }
            }, 1500);
        });
    </script>
</body>

</html>
