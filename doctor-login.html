<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login - Neuro Diagnosis</title>
    <meta name="description" content="Doctor portal login for Neuro Diagnosis brain tumor detection system">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <!-- Back to Home Link -->
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none text-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>

                    <!-- Login Card -->
                    <div class="login-card">
                        <!-- Header -->
                        <div class="login-header"
                            style="background: linear-gradient(135deg,  #7BB661 0%,  #7BB661 100%);">
                            <i class="bi bi-clipboard2-pulse-fill"></i>
                            <h1 class="h3 mb-2">Neuro Diagnosis</h1>
                            <p class="mb-0">Doctor Portal - Professional Access</p>
                        </div>

                        <!-- Body -->
                        <div class="login-body">
                            <h2 class="h4 text-center mb-2" style="color:  #7BB661;">Doctor Portal Login</h2>
                            <p class="text-center text-muted small mb-4">For authorized medical professionals only</p>

                            <!-- Login Form -->
                            <form id="doctorLoginForm">
                                <!-- Email Field -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="bi bi-envelope me-2"></i>Email Address
                                    </label>
                                    <input type="email" class="form-control form-control-lg" id="email"
                                        placeholder="doctor@hospital.com" required>
                                </div>

                                <!-- Medical License Number -->
                                <div class="mb-3">
                                    <label for="licenseNumber" class="form-label">
                                        <i class="bi bi-card-text me-2"></i>Medical License Number
                                    </label>
                                    <input type="text" class="form-control form-control-lg" id="licenseNumber"
                                        placeholder="Enter your license number" required>
                                </div>

                                <!-- Password Field -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="bi bi-lock me-2"></i>Password
                                    </label>
                                    <input type="password" class="form-control form-control-lg" id="password"
                                        placeholder="Enter your password" required>
                                </div>

                                <!-- Remember Me & Forgot Password -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="forgot-password.html" class="text-decoration-none small">Forgot password?</a>
                                </div>

                                <!-- Login Button -->
                                <button type="submit" class="btn btn-lg w-100 mb-3"
                                    style="background: linear-gradient(135deg,  #7BB661 0%,  #7BB661 100%); color: white;">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Login to Portal
                                </button>

                                <!-- Register Link -->
                                <div class="text-center">
                                    <p class="mb-0 text-muted">
                                        Need access?
                                        <a href="doctor-register.html" class="text-decoration-none fw-bold"
                                            style="color:  #7BB661;">Request Account</a>
                                    </p>
                                </div>
                            </form>
                        </div>

                        <!-- Disclaimer -->
                        <div class="text-center p-3 bg-light border-top">
                            <small class="text-muted">
                                <i class="bi bi-shield-lock me-1"></i>
                                Secure professional portal for authorized medical staff
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>

    <!-- Doctor Login Script -->
    <script>
        document.getElementById('doctorLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const email = document.getElementById('email').value;
            const licenseNumber = document.getElementById('licenseNumber').value;

            // Simulate successful login
            const userData = {
                name: 'Dr. Sarah Johnson',
                email: email,
                licenseNumber: licenseNumber,
                status: (email === 'pending@doctor.com') ? 'pending' : 'active', // Mock status for demo
                id: 'DR' + Math.floor(Math.random() * 10000)
            };

            // Store session
            setUserSession('doctor', userData);

            // Check status
            if (userData.status === 'pending') {
                showAlert('Your account is pending verification.', 'warning');
                setTimeout(() => {
                    window.location.href = 'doctor-pending.html';
                }, 1000);
            } else {
                // Show success message
                showAlert('Login successful! Redirecting to doctor portal...', 'success');

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'doctor-dashboard.html';
                }, 1000);
            }
        });
    </script>
</body>

</html>
