<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - Neuro Diagnosis</title>
    <meta name="description" content="Doctor registration for Neuro Diagnosis brain tumor detection system">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Registration Container -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <!-- Back to Home Link -->
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none text-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>

                    <!-- Registration Card -->
                    <div class="login-card">
                        <!-- Header -->
                        <div class="login-header"
                            style="background: linear-gradient(135deg,  #7BB661 0%,  #7BB661 100%);">
                            <i class="bi bi-person-plus-fill"></i>
                            <h1 class="h3 mb-2">Neuro Diagnosis</h1>
                            <p class="mb-0">Doctor Registration</p>
                        </div>

                        <!-- Body -->
                        <div class="login-body">
                            <h2 class="h4 text-center mb-2" style="color:  #7BB661;">Create Doctor Account</h2>
                            <p class="text-center text-muted small mb-4">Register for professional access</p>

                            <!-- Registration Form -->
                            <form id="doctorRegisterForm">
                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">
                                        <i class="bi bi-person me-2"></i>Full Name
                                    </label>
                                    <input type="text" class="form-control" id="fullName" placeholder="Dr. John Smith"
                                        required>
                                </div>

                                <!-- Email Field -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="bi bi-envelope me-2"></i>Email Address
                                    </label>
                                    <input type="email" class="form-control" id="email"
                                        placeholder="doctor@hospital.com" required>
                                </div>

                                <!-- Medical License Number -->
                                <div class="mb-3">
                                    <label for="licenseNumber" class="form-label">
                                        <i class="bi bi-card-text me-2"></i>Medical License Number
                                    </label>
                                    <input type="text" class="form-control" id="licenseNumber"
                                        placeholder="Enter your license number" required>
                                </div>

                                <!-- Specialization -->
                                <div class="mb-3">
                                    <label for="specialization" class="form-label">
                                        <i class="bi bi-hospital me-2"></i>Specialization
                                    </label>
                                    <select class="form-control" id="specialization" required>
                                        <option value="">Select specialization</option>
                                        <option value="neurology">Neurology</option>
                                        <option value="neurosurgery">Neurosurgery</option>
                                        <option value="radiology">Radiology</option>
                                        <option value="oncology">Oncology</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>

                                <!-- Password Field -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="bi bi-lock me-2"></i>Password
                                    </label>
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Create a password" required>
                                </div>

                                <!-- Confirm Password Field -->
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">
                                        <i class="bi bi-lock-fill me-2"></i>Confirm Password
                                    </label>
                                    <input type="password" class="form-control" id="confirmPassword"
                                        placeholder="Confirm your password" required>
                                </div>

                                <!-- Terms and Conditions -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                    <label class="form-check-label small" for="agreeTerms">
                                        I agree to the <a href="#" class="text-decoration-none">Terms and Conditions</a>
                                        and confirm I am a licensed medical professional
                                    </label>
                                </div>

                                <!-- Register Button -->
                                <button type="submit" class="btn btn-lg w-100 mb-3"
                                    style="background: linear-gradient(135deg,  #7BB661 0%,  #7BB661 100%); color: white;">
                                    <i class="bi bi-person-check me-2"></i>Register Account
                                </button>

                                <!-- Login Link -->
                                <div class="text-center">
                                    <p class="mb-0 text-muted">
                                        Already have an account?
                                        <a href="doctor-login.html" class="text-decoration-none fw-bold"
                                            style="color:  #7BB661;">Login</a>
                                    </p>
                                </div>
                            </form>
                        </div>

                        <!-- Disclaimer -->
                        <div class="text-center p-3 bg-light border-top">
                            <small class="text-muted">
                                <i class="bi bi-shield-lock me-1"></i>
                                Your information will be verified before account activation
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>

    <!-- Doctor Registration Script -->
    <script>
        document.getElementById('doctorRegisterForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const licenseNumber = document.getElementById('licenseNumber').value;
            const specialization = document.getElementById('specialization').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showAlert('Passwords do not match!', 'error');
                return;
            }

            // Validate password strength (minimum 6 characters)
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long', 'error');
                return;
            }

            // Simulate successful registration
            const userData = {
                name: fullName,
                email: email,
                licenseNumber: licenseNumber,
                specialization: specialization,
                status: 'pending', // Added pending status
                id: 'DR' + Math.floor(Math.random() * 10000),
                registrationDate: new Date().toISOString()
            };

            // Store session
            setUserSession('doctor', userData);

            // Show success message
            showAlert('Registration submitted! Your account is pending professional verification.', 'success');

            // Redirect to pending page
            setTimeout(() => {
                window.location.href = 'doctor-pending.html';
            }, 1500);
        });
    </script>
</body>

</html>
