<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - Neuro Diagnosis</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom-style.css">
</head>

<body class="bg-light">
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top" style="background: linear-gradient(135deg, #7BB661 0%, #6BA055 100%);">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="doctor-dashboard.html">
                <i class="bi bi-brain fs-2 me-2"></i>
                <span class="fw-bold fs-4">Neuro Diagnosis</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="doctor-dashboard.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    </li>
                    <!-- Notification Bell -->
                    <li class="nav-item dropdown ms-lg-3">
                        <a class="nav-link notification-bell-wrapper" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" onclick="markNotificationsRead(getUserSession().userData.email); updateNotificationUI();">
                            <i class="bi bi-bell fs-5"></i>
                            <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end nd-notification-dropdown" aria-labelledby="notificationDropdown" id="notificationList">
                            <li class="dropdown-header">Notifications</li>
                            <li><span class="dropdown-item text-muted small py-3">No new notifications</span></li>
                        </ul>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <!-- Profile Header -->
        <div class="profile-header-card">
            <div class="row align-items-center">
                <div class="col-md-auto text-center mb-3 mb-md-0">
                    <div class="position-relative d-inline-block">
                        <img src="https://ui-avatars.com/api/?name=Doctor&background=ffffff&color=7BB661&size=128" alt="Profile" class="profile-avatar-large" id="profileAvatar">
                        <button class="btn btn-sm btn-light position-absolute bottom-0 end-0 rounded-circle shadow-sm" title="Change Photo">
                            <i class="bi bi-camera-fill"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md">
                    <div class="d-flex flex-wrap align-items-center mb-2">
                        <h1 class="h2 fw-bold mb-0 me-3" id="displayFullName">Dr. Loading...</h1>
                        <div id="verificationBadge" class="verification-badge badge-verified">
                            <i class="bi bi-patch-check-fill me-2"></i>Verified Physician
                        </div>
                    </div>
                    <p class="lead mb-3 opacity-90" id="displaySpecialization">Neurologist</p>
                    <div class="row g-3">
                        <div class="col-auto">
                            <div class="profile-stat-item">
                                <small class="d-block opacity-75">Medical ID</small>
                                <span class="fw-bold" id="displayId">--</span>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="profile-stat-item">
                                <small class="d-block opacity-75">Cases Reviewed</small>
                                <span class="fw-bold">1,248</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Sidebar Nav -->
            <div class="col-lg-3 mb-4">
                <div class="card profile-card">
                    <div class="card-body p-3">
                        <div class="nav flex-column nav-pills nav-pills-custom" id="v-pills-tab" role="tablist">
                            <button class="nav-link active" id="pill-personal-tab" data-bs-toggle="pill" data-bs-target="#pill-personal" type="button">
                                <i class="bi bi-person-lines-fill me-2"></i>Personal Info
                            </button>
                            <button class="nav-link" id="pill-professional-tab" data-bs-toggle="pill" data-bs-target="#pill-professional" type="button">
                                <i class="bi bi-hospital me-2"></i>Professional Info
                            </button>
                            <button class="nav-link" id="pill-security-tab" data-bs-toggle="pill" data-bs-target="#pill-security" type="button">
                                <i class="bi bi-shield-lock me-2"></i>Security
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-9">
                <div class="tab-content" id="v-pills-tabContent">
                    <!-- Personal Info -->
                    <div class="tab-pane fade show active" id="pill-personal">
                        <div class="card profile-card">
                            <div class="card-header bg-white py-3 border-bottom">
                                <h5 class="mb-0 fw-bold text-primary">Personal Details</h5>
                            </div>
                            <div class="card-body p-4">
                                <form id="personalInfoForm">
                                    <div class="row g-3">
                                        <div class="col-md-6 text-dark">
                                            <label class="form-label fw-semibold">Full Name</label>
                                            <input type="text" class="form-control" id="formFullName" required>
                                        </div>
                                        <div class="col-md-6 text-dark">
                                            <label class="form-label fw-semibold">Email Address</label>
                                            <input type="email" class="form-control" id="formEmail" required>
                                        </div>
                                        <div class="col-md-6 text-dark">
                                            <label class="form-label fw-semibold">Phone Number</label>
                                            <input type="tel" class="form-control" id="formPhone" placeholder="+1 (555) 000-0000">
                                        </div>
                                        <div class="col-12 mt-4 text-dark">
                                            <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Professional Info -->
                    <div class="tab-pane fade" id="pill-professional">
                        <div class="card profile-card">
                            <div class="card-header bg-white py-3 border-bottom">
                                <h5 class="mb-0 fw-bold text-primary">Clinical Background</h5>
                            </div>
                            <div class="card-body p-4">
                                <form id="profInfoForm">
                                    <div class="row g-3">
                                        <div class="col-md-6 text-dark">
                                            <label class="form-label fw-semibold">Medical License #</label>
                                            <input type="text" class="form-control bg-light" id="formLicense" readonly>
                                            <small class="text-muted">License cannot be changed online.</small>
                                        </div>
                                        <div class="col-md-6 text-dark">
                                            <label class="form-label fw-semibold">Primary Specialization</label>
                                            <select class="form-select" id="formSpec">
                                                <option value="neurology">Neurology</option>
                                                <option value="neurosurgery">Neurosurgery</option>
                                                <option value="radiology">Radiology</option>
                                                <option value="oncology">Oncology</option>
                                            </select>
                                        </div>
                                        <div class="col-md-12 text-dark">
                                            <label class="form-label fw-semibold">Hospital / Institution</label>
                                            <input type="text" class="form-control" id="formHospital" placeholder="e.g. Central Medical Center">
                                        </div>
                                        <div class="col-12 mt-4 text-dark">
                                            <button type="submit" class="btn btn-primary px-4">Update Professional Profile</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Security -->
                    <div class="tab-pane fade" id="pill-security">
                        <div class="card profile-card">
                            <div class="card-header bg-white py-3 border-bottom">
                                <h5 class="mb-0 fw-bold text-primary">Account Security</h5>
                            </div>
                            <div class="card-body p-4">
                                <form id="securityForm">
                                    <div class="mb-3 text-dark">
                                        <label class="form-label fw-semibold">Current Password</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="mb-3 text-dark">
                                        <label class="form-label fw-semibold">New Password</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <div class="mb-4 text-dark">
                                        <label class="form-label fw-semibold">Confirm New Password</label>
                                        <input type="password" class="form-control">
                                    </div>
                                    <button type="submit" class="btn btn-danger">Change Password</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = getUserSession();
            if (!session.userData) {
                window.location.href = 'doctor-login.html';
                return;
            }

            const user = session.userData;

            // Populate UI
            updateUI(user);

            // Personal Info Form
            document.getElementById('personalInfoForm').addEventListener('submit', (e) => {
                e.preventDefault();
                user.name = document.getElementById('formFullName').value;
                user.email = document.getElementById('formEmail').value;
                user.phone = document.getElementById('formPhone').value;
                saveAndRefresh(user);
            });

            // Prof Info Form
            document.getElementById('profInfoForm').addEventListener('submit', (e) => {
                e.preventDefault();
                user.specialization = document.getElementById('formSpec').value;
                user.hospital = document.getElementById('formHospital').value;
                saveAndRefresh(user);
            });

            // Security Form
            document.getElementById('securityForm').addEventListener('submit', (e) => {
                e.preventDefault();
                showAlert('Password updated successfully (simulated).', 'success');
            });

            function updateUI(data) {
                document.getElementById('displayFullName').textContent = data.name;
                document.getElementById('displaySpecialization').textContent = data.specialization.charAt(0).toUpperCase() + data.specialization.slice(1);
                document.getElementById('displayId').textContent = data.id || 'DR-TEMP';
                
                document.getElementById('formFullName').value = data.name;
                document.getElementById('formEmail').value = data.email;
                document.getElementById('formPhone').value = data.phone || '';
                document.getElementById('formLicense').value = data.licenseNumber || '99-88-77-66';
                document.getElementById('formSpec').value = data.specialization;
                document.getElementById('formHospital').value = data.hospital || '';

                // Verification Badge
                const badge = document.getElementById('verificationBadge');
                if (data.status === 'pending') {
                    badge.className = 'verification-badge badge-pending';
                    badge.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Pending Verification';
                } else {
                    badge.className = 'verification-badge badge-verified';
                    badge.innerHTML = '<i class="bi bi-patch-check-fill me-2"></i>Verified Physician';
                }

                // Header Notification UI
                if (typeof updateNotificationUI === 'function') {
                    updateNotificationUI();
                }
            }

            function saveAndRefresh(updatedData) {
                setUserSession('doctor', updatedData);
                updateUI(updatedData);
                showAlert('Profile updated successfully!', 'success');
            }
        });
    </script>
</body>

</html>
