<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Neuro Diagnosis</title>
    <meta name="description" content="Admin portal login for Neuro Diagnosis system">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <!-- Back to Home Link -->
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none" style="color: #475569;">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>

                    <!-- Login Card -->
                    <div class="login-card">
                        <!-- Header -->
                        <div class="login-header" style="background: linear-gradient(135deg, #7BB661 0%, #6BA055 100%);">
                            <i class="bi bi-shield-lock-fill"></i>
                            <h1 class="h3 mb-2">Neuro Diagnosis</h1>
                            <p class="mb-0">System Administration</p>
                        </div>

                        <!-- Body -->
                        <div class="login-body">
                            <h2 class="h4 text-center mb-2" style="color: #7BB661;">Admin Login</h2>
                            <p class="text-center text-muted small mb-4">Strictly for authorized administrators</p>

                            <!-- Login Form -->
                            <form id="adminLoginForm">
                                <!-- Email Field -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="bi bi-envelope me-2"></i>Admin Email
                                    </label>
                                    <input type="email" class="form-control form-control-lg" id="email"
                                        placeholder="admin@neuro.com" value="admin@neuro.com" required>
                                </div>

                                <!-- Password Field -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="bi bi-lock me-2"></i>Password
                                    </label>
                                    <input type="password" class="form-control form-control-lg" id="password"
                                        placeholder="Enter password" value="Admin@12" required>
                                </div>

                                <!-- Remember Me -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                </div>

                                <!-- Login Button -->
                                <button type="submit" class="btn btn-lg w-100 mb-3"
                                    style="background: linear-gradient(135deg, #7BB661 0%, #6BA055 100%); color: white; border: none;">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Access Dashboard
                                </button>
                            </form>
                        </div>

                        <!-- Disclaimer -->
                        <div class="text-center p-3 bg-light border-top">
                            <small class="text-muted">
                                <i class="bi bi-shield-check me-1"></i>
                                Protected by Enterprise-grade Security
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>

    <!-- Admin Login Script -->
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Specific Credential Check
            if (email === 'admin@neuro.com' && password === 'Admin@12') {
                // Simulate successful login
                const userData = {
                    name: 'System Admin',
                    email: email,
                    role: 'Administrator',
                    id: 'ADM-001'
                };

                // Store session
                setUserSession('admin', userData);

                // Show success message
                if(window.showAlert) {
                    showAlert('Authentication successful! Initializing admin dashboard...', 'success');
                } else {
                    alert('Authentication successful! Initializing admin dashboard...');
                }

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);
            } else {
                if(window.showAlert) {
                    showAlert('Invalid credentials. Please use the test credentials.', 'danger');
                } else {
                    alert('Invalid credentials. Please use the test credentials.');
                }
            }
        });
    </script>
</body>

</html>
