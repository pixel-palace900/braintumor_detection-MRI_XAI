<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - Neuro Diagnosis</title>
    <meta name="description" content="Patient login portal for Neuro Diagnosis brain tumor detection system">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <!-- Back to Home Link -->
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none text-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>

                    <!-- Login Card -->
                    <div class="login-card">
                        <!-- Header -->
                        <div class="login-header">
                            <i class="bi bi-brain"></i>
                            <h1 class="h3 mb-2">Neuro Diagnosis</h1>
                            <p class="mb-0">Brain Tumor Detection with AI</p>
                        </div>

                        <!-- Body -->
                        <div class="login-body">
                            <h2 class="h4 text-center mb-4 text-primary fw-bold">Patient Login</h2>

                            <!-- Login Form -->
                            <form id="patientLoginForm">
                                <!-- Email Field -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        <i class="bi bi-envelope me-2"></i>Email Address
                                    </label>
                                    <input type="email" class="form-control form-control-lg" id="email"
                                        placeholder="Enter your email" required>
                                </div>

                                <!-- Password Field -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">
                                        <i class="bi bi-lock me-2"></i>Password
                                    </label>
                                    <input type="password" class="form-control form-control-lg" id="password"
                                        placeholder="Enter your password" required>
                                </div>

                                <!-- Remember Me & Forgot Password -->
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="forgot-password.html" class="text-decoration-none small">Forgot password?</a>
                                </div>

                                <!-- Login Button -->
                                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                                </button>

                                <!-- Register Link -->
                                <div class="text-center">
                                    <p class="mb-0 text-muted">
                                        Don't have an account?
                                        <a href="#" class="text-primary text-decoration-none fw-bold">Register</a>
                                    </p>
                                </div>
                            </form>
                        </div>

                        <!-- Disclaimer -->

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>

    <!-- Patient Login Script -->
    <script>
        document.getElementById('patientLoginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const email = document.getElementById('email').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Simulate successful login
            const userData = {
                name: 'John Doe',
                email: email,
                id: 'PT' + Math.floor(Math.random() * 10000)
            };

            // Store session
            setUserSession('patient', userData);

            // Show success message
            showAlert('Login successful! Redirecting...', 'success');

            // Redirect to dashboard
            setTimeout(() => {
                window.location.href = 'patient-dashboard.html';
            }, 1000);
        });
    </script>
</body>

</html>
