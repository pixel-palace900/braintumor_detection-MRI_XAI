<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Neuro Diagnosis</title>
    <meta name="description" content="Register as a new patient for brain tumor detection">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Login Container -->
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <!-- Back to Home Link -->
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none text-primary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>

                    <!-- Registration Card -->
                    <div class="login-card">
                        <!-- Header -->
                        <div class="login-header">
                            <i class="bi bi-person-plus-fill"></i>
                            <h1 class="h3 mb-2">Neuro Diagnosis</h1>
                            <p class="mb-0">Patient Registration</p>
                        </div>

                        <!-- Body -->
                        <div class="login-body">
                            <h2 class="h4 text-center mb-4 text-primary fw-bold">Register for Brain Tumor Screening</h2>

                            <!-- Registration Form -->
                            <form id="patientRegisterForm">
                                <!-- Patient Name -->
                                <div class="mb-3">
                                    <label for="patientName" class="form-label">
                                        <i class="bi bi-person me-2"></i>Full Name
                                    </label>
                                    <input type="text" class="form-control form-control-lg" id="patientName"
                                        placeholder="Enter your full name" required>
                                </div>

                                <!-- Age -->
                                <div class="mb-3">
                                    <label for="age" class="form-label">
                                        <i class="bi bi-calendar me-2"></i>Age
                                    </label>
                                    <input type="number" class="form-control form-control-lg" id="age"
                                        placeholder="Enter your age" min="1" max="120" required>
                                </div>

                                <!-- Gender -->
                                <div class="mb-3">
                                    <label for="gender" class="form-label">
                                        <i class="bi bi-gender-ambiguous me-2"></i>Gender
                                    </label>
                                    <select class="form-select form-select-lg" id="gender" required>
                                        <option value="">Select gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>


                                <!-- Phone -->
                                <div class="mb-3">
                                    <label for="phone" class="form-label">
                                        <i class="bi bi-telephone me-2"></i>Phone Number
                                    </label>
                                    <input type="tel" class="form-control form-control-lg" id="phone"
                                        placeholder="Enter your phone number" required>
                                </div>

                                <!-- Upload MRI Scan -->
                                <div class="mb-4">
                                    <label for="mriScan" class="form-label">
                                        <i class="bi bi-file-earmark-medical me-2"></i>Upload MRI Scan
                                    </label>
                                    <input type="file" class="form-control form-control-lg" id="mriScan"
                                        accept=".jpg,.jpeg,.png" required>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle me-1"></i>
                                        Accepted formats: JPG, PNG (Max 5MB)
                                    </div>

                                    <!-- Image Preview -->
                                    <div id="imagePreviewContainer" class="mt-3 d-none">
                                        <p class="small fw-semibold mb-2">Preview:</p>
                                        <img id="imagePreview" src="" alt="MRI Preview" class="img-fluid rounded"
                                            style="max-height: 200px;">
                                    </div>
                                </div>

                                

                                <!-- Register Button -->
                                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                    <i class="bi bi-person-check me-2"></i>Register & Analyze Scan
                                </button>

                                <!-- Login Link -->
                                <div class="text-center">
                                    <p class="mb-0 text-muted">
                                        Already registered?
                                        <a href="patient-login.html"
                                            class="text-primary text-decoration-none fw-bold">Login</a>
                                    </p>
                                </div>
                            </form>
                        </div>

                        <!-- Disclaimer -->
                        <div class="text-center p-3 bg-light border-top">
                            <small class="text-muted">
                                <i class="bi bi-shield-check me-1"></i>
                                Your data is secure and confidential
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
    <script src="js/ui-feedback.js"></script>

    <!-- Registration Script -->
    <script>
        const form = document.getElementById('patientRegisterForm');
        const mriInput = document.getElementById('mriScan');
        const imagePreview = document.getElementById('imagePreview');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');

        // Preview uploaded MRI scan
        mriInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                // Validate file
                const validation = validateUploadedFile(file);
                if (!validation.isValid) {
                    showAlert(validation.message, 'error');
                    mriInput.value = '';
                    imagePreviewContainer.classList.add('d-none');
                    return;
                }

                // Show preview
                const reader = new FileReader();
                reader.onload = function (e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const patientData = {
                name: document.getElementById('patientName').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phone').value,
                registrationDate: new Date().toISOString()
            };

            // Get MRI scan
            const mriFile = mriInput.files[0];
            if (!mriFile) {
                showAlert('Please upload an MRI scan', 'error');
                return;
            }

            // Validate file
            const validation = validateUploadedFile(mriFile);
            if (!validation.isValid) {
                showAlert(validation.message, 'error');
                return;
            }

            // Show loading
            showLoading('Registering patient and analyzing MRI scan...');

            // Read the image file
            const reader = new FileReader();
            reader.onload = function (e) {
                const imageData = e.target.result;

                // Generate patient ID
                const patientId = 'PT-2025-' + Math.floor(Math.random() * 9000 + 1000);
                patientData.patientId = patientId;

                // Store patient data
                sessionStorage.setItem('currentPatient', JSON.stringify(patientData));
                sessionStorage.setItem('uploadedImage', imageData);
                sessionStorage.setItem('uploadedFileName', mriFile.name);

                // Simulate analysis (2.5 seconds)
                setTimeout(function () {
                    hideLoading();

                    // Show success message
                    showAlert('Registration successful! Analyzing your MRI scan...', 'success');

                    // Redirect to results page after brief delay
                    setTimeout(function () {
                        window.location.href = 'patient-results-new.html';
                    }, 1000);
                }, 2500);
            };

            reader.readAsDataURL(mriFile);
        });
    </script>
</body>

</html>
